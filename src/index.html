<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamburg Map Explorer</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
/>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="map" aria-label="Hamburg map background"></div>

<aside class="app" aria-label="Spot score sidebar">
    <div class="app-shell">
        <div class="search-shell" role="search">
            <div class="search-toolbar">
                <div class="search-field">
                    <label class="field-label visually-hidden" for="addressSearchInput">Search address</label>
                    <input
                        id="addressSearchInput"
                        type="search"
                        placeholder="Search Spots..."
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-controls="addressSearchResults"
                    />
                </div>
                <div class="search-actions">
                    <button class="icon-btn search-btn" type="button" aria-label="Search">
                        <span class="icon-placeholder" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <ul id="addressSearchResults" class="suggestion-list is-hidden" role="listbox" aria-label="Address suggestions"></ul>
        </div>
        <header class="app-header">
            <p class="eyebrow">Spot Score</p>
            <h1>Hamburg Map Explorer</h1>
            <p id="subtitleText" class="subtitle">Pick a spot on the map or search for an address to compare local weather signals and compute a location score.</p>
        </header>

        <div id="output" class="result is-hidden" aria-live="polite"></div>
    </div>
</aside>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script type="module" src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="./compare.js"></script>
<script type="module" src="./multiplayer.js"></script>
</body>
</html>
