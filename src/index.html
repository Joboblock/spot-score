<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamburg Map Explorer</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
/>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="map" aria-label="Hamburg map background"></div>

<aside class="app" aria-label="Spot score sidebar">
    <h2>Hamburg Map Explorer</h2>
    <p id="subtitleText" class="subtitle">Pick a spot (map click or clipboard import) to see that location and the weather stations used for scoring.</p>

    <div class="import-spot-controls">
        <button id="importSpotBtn" type="button">Import Spot</button>
        <p class="hint">Copy coordinates to clipboard (e.g. <code>53.5511, 9.9937</code>) and click Import Spot. You can also click directly on the map.</p>
    </div>

    <div id="output" class="result is-hidden" aria-live="polite"></div>
</aside>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script type="module" src="./script.js"></script>

</body>
</html>
