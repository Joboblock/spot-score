<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamburg Traffic Noise Explorer</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
/>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">
    <h2 id="appTitle">Hamburg Map Explorer</h2>
    <p id="datasetSource" class="subtitle">Source: API Hamburg</p>

    <form id="trafficForm">
        <label for="collectionSelect">Map dataset</label>
        <select id="collectionSelect">
            <optgroup label="Traffic noise">
                <option value="traffic_tag_abend_nacht">Tag / Abend / Nacht 2022</option>
                <option value="traffic_nacht">Nacht 2022</option>
            </optgroup>
            <optgroup label="Urban climate analysis 2023">
                <option value="kaltlufteinwirkbereich">Kaltlufteinwirkbereich</option>
            </optgroup>
        </select>

        <button id="searchBtn" type="submit">Load data</button>
    </form>

    <div id="output" class="result"></div>

    <div class="map-wrapper">
        <h3>Map View</h3>
        <div id="map" aria-label="Hamburg thematic map"></div>
    </div>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script type="module" src="./script.js"></script>

</body>
</html>
