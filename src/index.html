<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamburg Map Explorer</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
/>
<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">
    <h2>Hamburg Map Explorer</h2>
    <p id="subtitleText" class="subtitle">Select a map mode to load either Lden noise data or Netatmo weather stations.</p>

    <form id="mapForm">
        <label for="mapModeSelect">Map mode</label>
        <select id="mapModeSelect">
            <option value="noise" selected>Lden noise map</option>
            <option value="weather">Netatmo weather map</option>
        </select>

        <button id="searchBtn" type="submit">Load selected map</button>
    </form>

    <form id="coordinateForm">
        <label for="latitudeInput">Latitude</label>
        <input id="latitudeInput" type="number" step="any" placeholder="e.g. 53.5511" required>

        <label for="longitudeInput">Longitude</label>
        <input id="longitudeInput" type="number" step="any" placeholder="e.g. 9.9937" required>

        <button id="setMarkerBtn" type="submit">Set marker at coordinates</button>
        <p class="hint">Tip: You can also click directly on the map to place the marker.</p>
    </form>

    <div class="map-wrapper">
        <h3>Map View</h3>
        <div id="map" aria-label="Hamburg map view"></div>
    </div>

    <div id="output" class="result is-hidden" aria-live="polite"></div>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>
<script type="module" src="./script.js"></script>

</body>
</html>
